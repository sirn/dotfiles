[default.redirects]
action = "allow"

[default.heredocs]
action = "ask"

[default.paths.allow]
read = [
  "**/*.env.example",
  "**/*.env.sample",
  "**/.env.example",
  "**/.env.sample",
]
edit = [
  "**/*.env.example",
  "**/*.env.sample",
  "**/.env.example",
  "**/.env.sample",
]
write = [
  "**/*.env.example",
  "**/*.env.sample",
  "**/.env.example",
  "**/.env.sample",
]

[default.paths.deny]
read = [
