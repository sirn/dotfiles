# Plan mode: block filesystem-mutating commands

[[mode.plan.commands.deny.shell]]
match = "cp"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "ln"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "mkdir"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "mktemp"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "mv"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "rsync"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "sed -i"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "tee"
mode = "prefix"

[[mode.plan.commands.deny.shell]]
match = "touch"
mode = "prefix"

[mode.plan.redirects]
action = "deny"
safeTargets = ["/dev/null", "/dev/stderr", "/dev/stdout"]
allowFdDup = true

[mode.plan.heredocs]
action = "ask"

[mode.plan.tools]
edit = false
write = false

[mode.build.tools]
edit = true
write = true
