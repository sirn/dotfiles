  "**/*credentials*.json",
  "**/*secret*",
  "**/*secrets*",
  "**/*token*",
  "**/*apikey*",
  "**/*api_key*",
  "**/.aws/credentials",
  "**/.npmrc",
  "**/.pypirc",
  "**/.netrc",
  "**/.docker/config.json",
  "**/sops*.yml",
  "**/sops*.yaml",
  "**/*.agekey",
]
edit = [
